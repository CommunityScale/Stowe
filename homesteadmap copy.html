<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display a globe on a webpage</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<style>
    .legend {
        background-color: #fff;
        border-radius: 3px;
        bottom: 30px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        font:
            12px/20px 'Helvetica Neue',
            Arial,
            Helvetica,
            sans-serif;
        padding: 10px;
        position: absolute;
        right: 10px;
        z-index: 1;
    }

    .legend h4 {
        margin: 0 0 10px;
    }

    .legend div span {
        border-radius: 50%;
        display: inline-block;
        height: 10px;
        margin-right: 5px;
        width: 10px;
    }
</style>
<div id="map"></div>
<div id="state-legend" class="legend">
    <div><span style="background-color: #1E88E5"></span>Homestead exemption</div>
    <div><span style="background-color: #FFC107"></span>No homestead exemption</div>
    <div><span style="background-color: #bb1d4f"></span>Short term rental with 5+ bookings in past year</div>
</div>


<script>
	mapboxgl.accessToken = 'pk.eyJ1Ijoic2FyYWJyZW50IiwiYSI6ImNtMHpsb2Q4NTAwemoybHExbnB6eHVvZ2kifQ.nH0hUSv3IGzX6MkYB_cSmA';
    const map = new mapboxgl.Map({
        container: 'map',
        // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
        style: 'mapbox://styles/mapbox/satellite-streets-v12',
        zoom: 11,
        center: [-72.688122,44.467397],
        projection: 'globe'
    });

    map.on('load', () => {
        // Set the default atmosphere style
        map.setFog({});

        map.addSource('mapillary', {
            'type': 'vector',
            'tiles': [
                'https://tiles.mapillary.com/maps/vtp/mly1_public/2/{z}/{x}/{y}?access_token=MLY|4142433049200173|72206abe5035850d6743b23a49c41333'
            ],
            'minzoom': 8,
            'maxzoom': 14
        })

        map.addSource('StoweAllResi', {
            type: 'geojson',
            data: 'StoweAllResi2.geojson'
        });

        map.addSource('STR', {
            type: 'geojson',
            data: 'STRSpoints.geojson'
        });

        map.addSource('boundary', {
            type: 'geojson',
            data: 'Boundary.geojson'
        });

        map.addSource('resi', {
            type: 'geojson',
            data: 'resipoints.geojson'
        });

        map.addLayer({
            id: 'boundary',
            type: 'line',
            source: 'boundary',
            paint: {
                'line-color': 'white'
            }
        });

        map.addLayer({
        id: 'ResiAll',
        type: 'circle',
        source: 'resi',
        paint: {

            'circle-color': [
            'match',
            ['get', 'homestead'],
            'yes', '#1E88E5',
            'no', '#FFC107',
            'black' // default color if value doesn't match
        ],
        'circle-radius': {
            'base': 3,
            'stops': [
                [12, 4],
                [22, 180]
            ]
        }
    }
        });

        map.addLayer({
        id: 'STR-homestead-or-no',
        type: 'circle',
        source: 'STR',
        paint: {
            "circle-stroke-width": 3,
            "circle-stroke-color": '#bb1d4f',
        'circle-color': [
            'match',
            ['get', 'homestead'],
            'yes', '#1E88E5',
            'no', '#FFC107',
            'black' // default color if value doesn't match
        ],
        'circle-radius': {
            'base': 3,
            'stops': [
                [12, 4],
                [22, 180]
            ]
        }
    }
        });

        map.setFilter('STR-homestead-or-no', ['==', ['get', 'STR__5__bookings_'], 'Yes']);

    });


</script>

</body>
</html>
